# Local development stack: PostgreSQL + pgAdmin.
#
#   docker compose up -d        # start
#   docker compose ps           # check health
#   docker compose down         # stop (keeps data)
#   docker compose down -v      # stop and wipe data
#
# The credentials below are non-secret development defaults and match
# application-docker.properties.example. Run the app against this DB with:
#   mvn spring-boot:run -Dspring-boot.run.profiles=docker

services:
  postgres:
    image: postgres:16-alpine
    container_name: passwordy-postgres
    environment:
      POSTGRES_DB: passwordy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - passwordy-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d passwordy"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: passwordy-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@passwordy.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  passwordy-pgdata:
