gg.jte.development-mode=true
spring.application.name=passwordy

spring.datasource.url=jdbc:h2:mem:passwordydb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# Schema is owned by Flyway migrations (db/migration/{vendor}); Hibernate only validates that
# the entities match the migrated schema — it never alters it. This is the case across all
# profiles (H2 for tests, PostgreSQL for real deployments).
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/{vendor}

# Email verification. Real SMTP credentials live in the gitignored
# application-{local,docker}.properties (copy from the *.example). The localhost default lets
# the context start with no mail server; sends just fail-and-log until SMTP is configured.
spring.mail.host=localhost
spring.mail.port=25
app.mail.from=no-reply@passwordy.local
app.base-url=http://localhost:8080
app.verification.token-ttl-hours=24

# Reject master passwords found in Have I Been Pwned (k-anonymity). Fails open if HIBP is down.
breachcheck.enabled=true
breachcheck.api-url=https://api.pwnedpasswords.com
# H2 web console disabled by default — unnecessary attack surface. Enable locally only if
# needed (e.g. -Dspring.h2.console.enabled=true).
spring.h2.console.enabled=false

# Crypto secrets — THROWAWAY DEV DEFAULTS for the zero-setup H2 profile only.
# Real deployments override these via the gitignored application-{local,docker}.properties.
jwt.secret=aK55YKBmvk1ckwElf+VLQNod04L1IJNr2g1xYlNB6LL0p7pPx1ERvdwRXw81yvQtsZs4GmIx7552EO6LyDuTdQ==
# Access token is short-lived (15 min); clients refresh via /api/auth/refresh.
jwt.expiration=900000
# Refresh-token lifetime (days).
auth.refresh-ttl-days=30
encryption.secret.key=pIi2Yod1hDyFQiXIJr5MuR6L0LXuRPSNnISn6W5YdSM=

# Monitoring (Spring Boot Actuator). Expose only health + info over HTTP; health is public
# (probes for load balancers / uptime monitors), and per-component details are shown only to
# authenticated callers. Liveness/readiness groups are enabled for orchestrators.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true
# Don't let a transient SMTP outage mark the whole app DOWN (which would make probes restart it);
# mail is best-effort and sends fail-and-log on their own.
management.health.mail.enabled=false

# Rate limiting — tiered token buckets. auth/generation keyed by IP, authenticated by username.
ratelimit.enabled=true
# Bucket store: "memory" (default, single instance) or "redis" (shared across instances).
ratelimit.store=memory
# ratelimit.redis.url=redis://localhost:6379
ratelimit.auth.capacity=5
ratelimit.auth.refill-seconds=60
ratelimit.generation.capacity=20
ratelimit.generation.refill-seconds=60
ratelimit.authenticated.capacity=100
ratelimit.authenticated.refill-seconds=60
# Account-level login throttle (service layer), keyed by the submitted username.
ratelimit.login-per-user.capacity=5
ratelimit.login-per-user.refill-seconds=60
# Front-proxy IPs whose X-Forwarded-For may be trusted. Empty = trust none (use getRemoteAddr).
# ratelimit.trusted-proxies=10.0.0.1,10.0.0.2


